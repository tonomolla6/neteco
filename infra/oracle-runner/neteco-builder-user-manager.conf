# Exclusive user@11080.service drop-in. Install only after reserving this UID,
# inspecting package paths and verifying the workspace-view mount. Never apply
# to user@.service globally. The Actions runner retains NNP/zero capabilities.
[Unit]
After=devtono-neteco-network.service devtono-neteco-egress.service devtono-neteco-workspace-view.service
Requires=devtono-neteco-network.service devtono-neteco-egress.service devtono-neteco-workspace-view.service
BindsTo=devtono-neteco-network.service devtono-neteco-egress.service devtono-neteco-workspace-view.service
JoinsNamespaceOf=devtono-neteco-network.service
RequiresMountsFor=/var/lib/neteco-ci-runtime
AssertPathIsMountPoint=/var/lib/neteco-ci-runtime/builder/workspace
AssertPathIsDirectory=/run/systemd/system

[Service]
RootDirectory=/var/lib/neteco-ci-runtime/rootfs
MountAPIVFS=yes
PrivateNetwork=yes
ProtectSystem=strict
# Empty readonly home/runtime roots, permitting only the explicit private
# /run/user/11080 bind. "yes" masks that child too and prevents user startup.
ProtectHome=tmpfs
ProtectProc=invisible
# Rootless UID/GID helpers require acquiring their existing package file caps.
# Do not use options that implicitly enable NNP or make delegated cgroups RO.
NoNewPrivileges=no
CapabilityBoundingSet=CAP_SETUID CAP_SETGID
AmbientCapabilities=
ProtectControlGroups=no
Delegate=cpu cpuset io memory pids
CPUQuota=100%
MemoryMax=2G
MemorySwapMax=256M
TasksMax=512
LimitCORE=0
UMask=0077
WorkingDirectory=/var/lib/neteco-ci-runtime/builder/home
Environment=HOME=/var/lib/neteco-ci-runtime/builder/home
Environment=PATH=/usr/bin:/usr/sbin:/bin:/sbin
Environment=TMPDIR=/var/lib/neteco-ci-runtime/builder/tmp
Environment=XDG_RUNTIME_DIR=/run/user/11080
Environment=SYSTEMD_UNIT_PATH=/etc/neteco-ci/builder-user:/usr/lib/systemd/user
Environment=SYSTEMD_LOG_TARGET=console
StandardOutput=journal
StandardError=journal
UnsetEnvironment=BASH_ENV ENV CDPATH LD_PRELOAD LD_LIBRARY_PATH DOCKER_HOST DOCKER_CONTEXT SSH_AUTH_SOCK GITHUB_TOKEN GH_TOKEN CLOUDFLARE_API_TOKEN
TemporaryFileSystem=/run:ro
BindPaths=/run/user/11080
# Sanitized empty view of the host's verified systemd boot marker, not its unit
# configs, D-Bus or control socket. Required by sd_booted() inside the chroot.
BindReadOnlyPaths=/etc/neteco-ci/systemd-boot-view:/run/systemd/system
BindPaths=/var/lib/neteco-ci-runtime/builder/home
BindPaths=/var/lib/neteco-ci-runtime/builder/data
BindPaths=/var/lib/neteco-ci-runtime/builder/tmp
# RootlessKit's copy-up implementation uses /tmp regardless of TMPDIR.
BindPaths=/var/lib/neteco-ci-runtime/builder/tmp:/tmp
BindPaths=/var/lib/neteco-ci-runtime/builder/socket
BindPaths=/var/lib/neteco-ci-runtime/builder/workspace:/var/lib/neteco-ci/runner/_work
BindPaths=/dev/net/tun
BindReadOnlyPaths=/etc/neteco-ci/builder-user
BindReadOnlyPaths=/etc/neteco-ci/builder-subuid:/etc/subuid
BindReadOnlyPaths=/etc/neteco-ci/builder-subgid:/etc/subgid
BindReadOnlyPaths=/etc/neteco-ci/resolv.conf:/etc/resolv.conf
# Exact public Noble systemd binary copied root-owned to the host filesystem:
# the nosuid runtime volume otherwise blocks PAM's normal SELinux transition.
# This individual RO bind does not relax the runtime volume's mount flags.
BindReadOnlyPaths=/usr/local/libexec/neteco-ci/builder-systemd:/usr/lib/systemd/systemd
# Official host package tools, not a bind of /usr or the production daemon.
BindReadOnlyPaths=/usr/bin/dockerd
BindReadOnlyPaths=/usr/bin/docker
BindReadOnlyPaths=/usr/bin/rootlesskit
BindReadOnlyPaths=/usr/bin/dockerd-rootless.sh
BindReadOnlyPaths=/usr/bin/containerd
BindReadOnlyPaths=/usr/bin/containerd-shim-runc-v2
BindReadOnlyPaths=/usr/bin/runc
# Maintained OCI runtime using the private user bus directly. Unlike runc's
# OwnerUID discovery, it does not require making unrelated /proc PIDs visible.
BindReadOnlyPaths=/usr/bin/crun
BindReadOnlyPaths=/usr/bin/docker-proxy
BindReadOnlyPaths=/usr/bin/newuidmap
BindReadOnlyPaths=/usr/bin/newgidmap
BindReadOnlyPaths=/usr/bin/slirp4netns
BindReadOnlyPaths=/usr/libexec/docker/docker-init
BindReadOnlyPaths=/usr/sbin/xtables-nft-multi
BindReadOnlyPaths=/usr/sbin/ip
BindReadOnlyPaths=/usr/sbin/xtables-nft-multi:/usr/sbin/iptables
BindReadOnlyPaths=/usr/sbin/xtables-nft-multi:/usr/sbin/ip6tables
BindReadOnlyPaths=/usr/sbin/xtables-nft-multi:/usr/sbin/iptables-save
BindReadOnlyPaths=/usr/sbin/xtables-nft-multi:/usr/sbin/ip6tables-save
BindReadOnlyPaths=/usr/sbin/xtables-nft-multi:/usr/sbin/iptables-restore
BindReadOnlyPaths=/usr/sbin/xtables-nft-multi:/usr/sbin/ip6tables-restore
# Matching RPM closure only. Noble libc/glib/systemd/seccomp remain unchanged.
BindReadOnlyPaths=/usr/lib64/libslirp.so.0.2.3:/usr/lib/aarch64-linux-gnu/libslirp.so.0
BindReadOnlyPaths=/usr/lib64/libxtables.so.12.7.0:/usr/lib/aarch64-linux-gnu/libxtables.so.12
BindReadOnlyPaths=/usr/lib64/libmnl.so.0.2.0:/usr/lib/aarch64-linux-gnu/libmnl.so.0
BindReadOnlyPaths=/usr/lib64/libnftnl.so.11.6.0:/usr/lib/aarch64-linux-gnu/libnftnl.so.11
BindReadOnlyPaths=/usr/lib64/libnetfilter_conntrack.so.3.8.0:/usr/lib/aarch64-linux-gnu/libnetfilter_conntrack.so.3
BindReadOnlyPaths=/usr/lib64/libnfnetlink.so.0.2.0:/usr/lib/aarch64-linux-gnu/libnfnetlink.so.0
BindReadOnlyPaths=/usr/lib64/libbpf.so.1.5.0:/usr/lib/aarch64-linux-gnu/libbpf.so.1
BindReadOnlyPaths=/usr/lib64/xtables

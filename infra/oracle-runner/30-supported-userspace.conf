# Source-only drop-in for devtono-neteco-actions-runner.service. Operator installs
# only after sealing the Ubuntu Noble ARM64 rootfs and validating all bind sources.
# Missing prerequisites fail startup; there is no fallback to the host userspace.
[Unit]
RequiresMountsFor=/var/lib/neteco-ci /var/lib/neteco-ci-runtime
AssertPathIsMountPoint=/var/lib/neteco-ci-runtime
AssertPathIsDirectory=/var/lib/neteco-ci-runtime/rootfs
AssertPathIsDirectory=/var/lib/neteco-ci-runtime/work
AssertPathIsDirectory=/var/lib/neteco-ci-runtime/cache
AssertPathIsDirectory=/var/lib/neteco-ci-runtime/tmp
AssertFileIsExecutable=/var/lib/neteco-ci-runtime/rootfs/usr/bin/bash
AssertFileIsExecutable=/opt/devtono/toolchains/node-v24.18.1-linux-arm64/bin/node
AssertPathExists=/etc/neteco-ci/npm-user.conf
AssertPathExists=/etc/neteco-ci/npm-global.conf

[Service]
RootDirectory=/var/lib/neteco-ci-runtime/rootfs
MountAPIVFS=yes
# Preserve the original runner/home paths; mount larger writable children over
# their existing locations. Bind sources are host paths, targets are in rootfs.
BindPaths=/var/lib/neteco-ci
BindPaths=/var/lib/neteco-ci-runtime/work:/var/lib/neteco-ci/runner/_work
BindPaths=/var/lib/neteco-ci-runtime/cache:/var/lib/neteco-ci/cache
BindPaths=/var/lib/neteco-ci-runtime/tmp:/var/lib/neteco-ci/tmp
BindReadOnlyPaths=/opt/devtono/toolchains/node-v24.18.1-linux-arm64
BindReadOnlyPaths=/usr/local/libexec/neteco-ci
BindReadOnlyPaths=/etc/neteco-ci
BindReadOnlyPaths=/etc/machine-id
# The base unit's /etc/neteco-ci/resolv.conf:/etc/resolv.conf bind remains active.
# Separate operator-owned files avoid reading host/user npm configuration.
Environment=NPM_CONFIG_USERCONFIG=/etc/neteco-ci/npm-user.conf
Environment=NPM_CONFIG_GLOBALCONFIG=/etc/neteco-ci/npm-global.conf
UnsetEnvironment=MINIFLARE_WORKERD_PATH NETECO_CAPABILITY_ROOT PLAYWRIGHT_WS_ENDPOINT PW_TEST_CONNECT_WS_ENDPOINT NPM_TOKEN NODE_AUTH_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN SENTRY_AUTH_TOKEN BEPLY_API_KEY CF_API_KEY
# UID/GID, zero capabilities, NNP, cgroups, namespace anchor and all existing
# production/home/container masks are inherited unchanged. Root Docker stays
# denied; the optional private-Docker drop-in exposes only Neteco's own engine.

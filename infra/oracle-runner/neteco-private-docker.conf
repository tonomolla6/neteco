# Install only after the rootless engine and UID/GID 11080 socket have been
# verified. No host Docker socket, daemon data, home or user bus is exposed.
[Unit]
After=user@11080.service
Requires=user@11080.service
BindsTo=user@11080.service
AssertPathExists=/var/lib/neteco-ci-runtime/builder/socket/docker.sock
AssertFileIsExecutable=/usr/local/libexec/neteco-ci/bin/docker
AssertFileIsExecutable=/usr/local/libexec/neteco-ci/docker-cli

[Service]
# Service-local supplementary group; no persistent host group membership.
SupplementaryGroups=neteco-builder
BindPaths=/var/lib/neteco-ci-runtime/builder/socket:/run/neteco-container
Environment=DOCKER_HOST=unix:///run/neteco-container/docker.sock
Environment=PATH=/usr/local/libexec/neteco-ci/bin:/opt/devtono/toolchains/node-v24.18.1-linux-arm64/bin:/usr/bin:/bin
UnsetEnvironment=DOCKER_CONTEXT DOCKER_TLS_VERIFY DOCKER_CERT_PATH BUILDKIT_HOST BUILDX_BUILDER BUILDX_CONFIG DOCKER_CONFIG
# The base unit must not unset DOCKER_HOST: systemd applies UnsetEnvironment
# after Environment. All its other secret/untrusted environment removals stay.
# This CLI endpoint is fixed; Buildx plugins have independent endpoints. The
# filesystem/network namespaces remain the isolation boundary for all plugins.

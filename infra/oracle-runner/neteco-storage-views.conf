# Operator-only empty statfs views and a single live host memory metric.
# No host root, container data or credentials become visible: storage sources
# are empty, root-owned directories; the memory source is one read-only file.
# Install alongside the supported-userspace drop-in; devices are recorded by
# the operator in root-owned /etc/neteco-ci/storage.json after inspecting them.
[Unit]
RequiresMountsFor=/var/lib/neteco-ci-runtime
AssertPathIsDirectory=/var/lib/neteco-ci-host/storage-view
AssertPathIsDirectory=/var/lib/neteco-ci-runtime/storage-view
AssertPathExists=/etc/neteco-ci/storage.json
AssertPathExists=/usr/local/libexec/neteco-ci/build-storage.mjs

[Service]
BindReadOnlyPaths=/var/lib/neteco-ci-host/storage-view:/run/neteco-ci-storage/host
BindReadOnlyPaths=/var/lib/neteco-ci-runtime/storage-view:/run/neteco-ci-storage/containers
# A live single-file host metric, not a procfs directory or cached exporter.
# Keep ProcSubset=pid; the pre-checkout hook rejects a missing/untrusted view.
BindReadOnlyPaths=/proc/meminfo:/run/neteco-ci-resources/meminfo

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_DB: neteco_test
          POSTGRES_USER: neteco
          POSTGRES_PASSWORD: neteco-test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U neteco -d neteco_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.2.1-alpine3.22
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      APP_BASE_URL: http://127.0.0.1:3100
      NUXT_PUBLIC_BASE_URL: http://127.0.0.1:3100
      DATABASE_URL: postgres://neteco:neteco-test@127.0.0.1:5432/neteco_test
      REDIS_URL: redis://127.0.0.1:6379/0
      NUXT_SESSION_PASSWORD: test-only-session-password-32-characters
      PAYMENT_PROVIDER: mock
      INVOICE_PROVIDER: mock
      CARRIER_PROVIDER: mock
      EMAIL_PROVIDER: log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run requirements:audit
      - run: npm run test:determinism
      - run: npm run test:flaky-policy
      - run: npm run ci:artifacts
      - run: npm run test:flake-monitor
      - run: npm run audit:exploratory
      - run: npm run audit:uat:policy
      - run: npm run coverage
      - run: npm run test:nuxt
      - run: npm run test:component
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:performance
      - run: npm run test:e2e -- --project=chromium --grep-invert accessibility
      - run: npm run test:a11y
      - run: npm run test:browser-matrix
      - run: npm run test:flake-browser
      - run: npm run test:visual
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .output
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - run: npm run ci:artifacts -- --publish --require-complete
        id: complete-artifacts
      - run: npm run ci:artifacts -- --publish
        if: failure()
        id: partial-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && (steps.complete-artifacts.outcome == 'success' || steps.partial-artifacts.outcome == 'success')
        with:
          name: quality-evidence
          path: |
            coverage/
            test-results/
            playwright-report/
            playwright-a11y-report/
            playwright-matrix-report/
            playwright-visual-report/
            sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 14

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          tags: neteco:${{ github.sha }}
          load: true
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: neteco:${{ github.sha }}
          format: spdx-json
          output-file: /tmp/neteco-container-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: neteco:${{ github.sha }}
          format: json
          output: /tmp/neteco-trivy.json
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - run: docker save neteco:${{ github.sha }} --output /tmp/neteco-image.tar
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: container-image
          path: |
            /tmp/neteco-image.tar
            /tmp/neteco-container-sbom.spdx.json
            /tmp/neteco-trivy.json
          retention-days: 3

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - run: npm run ci:artifacts -- --publish
        if: always()
        id: secure-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.secure-artifacts.outcome == 'success'
        with:
          name: mutation-evidence
          path: reports/mutation/
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3

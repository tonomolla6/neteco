name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NETECO_GITHUB_REPOSITORY: ${{ vars.NETECO_GITHUB_REPOSITORY }}

jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    runs-on:
      [
        self-hosted,
        Linux,
        ARM64,
        "${{ vars.NETECO_ORACLE_RUNNER_LABEL || 'neteco-oracle-unverified-do-not-register' }}"
      ]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_DB: neteco_test
          POSTGRES_USER: neteco
          POSTGRES_PASSWORD: neteco-test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U neteco -d neteco_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.2.1-alpine3.22
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      APP_BASE_URL: http://127.0.0.1:3100
      NUXT_PUBLIC_BASE_URL: http://127.0.0.1:3100
      DATABASE_URL: postgres://neteco:neteco-test@127.0.0.1:5432/neteco_test
      REDIS_URL: redis://127.0.0.1:6379/0
      NUXT_SESSION_PASSWORD: test-only-session-password-32-characters
      PAYMENT_PROVIDER: mock
      INVOICE_PROVIDER: mock
      CARRIER_PROVIDER: mock
      EMAIL_PROVIDER: log
    steps:
      - name: Verify approved Neteco repository
        shell: bash
        run: |
          test -n "$NETECO_GITHUB_REPOSITORY"
          test "$GITHUB_REPOSITORY" = "$NETECO_GITHUB_REPOSITORY"
          test "${GITHUB_REPOSITORY,,}" != 'publicher0/neteco-shop'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/storage-preflight.ts
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run requirements:audit
      - run: npm run test:determinism
      - run: npm run test:flaky-policy
      - run: npm run ci:artifacts
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:flake-monitor
      - run: npm run audit:exploratory
      - run: npm run audit:uat:policy
      - run: npm run build
      - run: npx playwright install chromium firefox webkit
      - run: npm run test:performance
      - run: npx tsx scripts/performance-gate.ts --report test-results/performance.json --diff-out test-results/performance-diff.md
      - run: npm run test:e2e -- --project=chromium --grep-invert accessibility
      - run: npm run test:a11y
      - run: npm run test:browser-matrix
      - run: npm run test:flake-browser
      - run: npm run test:visual
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .output
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - run: npm run ci:artifacts -- --publish --require-complete
        id: complete-artifacts
      - run: npm run ci:artifacts -- --publish
        if: failure()
        id: partial-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && (steps.complete-artifacts.outcome == 'success' || steps.partial-artifacts.outcome == 'success')
        with:
          name: quality-evidence
          path: |
            coverage/
            test-results/
            playwright-report/
            playwright-a11y-report/
            playwright-matrix-report/
            playwright-visual-report/
            sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 14

  container:
    if: github.ref == 'refs/heads/main'
    runs-on:
      [
        self-hosted,
        Linux,
        ARM64,
        "${{ vars.NETECO_ORACLE_RUNNER_LABEL || 'neteco-oracle-unverified-do-not-register' }}"
      ]
    timeout-minutes: 20
    steps:
      - name: Verify approved Neteco repository
        shell: bash
        run: |
          test -n "$NETECO_GITHUB_REPOSITORY"
          test "$GITHUB_REPOSITORY" = "$NETECO_GITHUB_REPOSITORY"
          test "${GITHUB_REPOSITORY,,}" != 'publicher0/neteco-shop'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: node scripts/storage-preflight.ts
      - name: Allocate private container artifact directory
        id: container-artifacts
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RUNNER_TEMP:-}" && "$RUNNER_TEMP" = /* && -d "$RUNNER_TEMP" ]]
          [[ "$(realpath -e -- "$RUNNER_TEMP")" == "$RUNNER_TEMP" ]]
          umask 077
          artifact_dir="$(mktemp -d "$RUNNER_TEMP/neteco-container.XXXXXXXX")"
          printf 'directory=%s\n' "$artifact_dir" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          tags: neteco:${{ github.sha }}
          load: true
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: neteco:${{ github.sha }}
          format: spdx-json
          output-file: ${{ steps.container-artifacts.outputs.directory }}/neteco-container-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: neteco:${{ github.sha }}
          format: json
          output: ${{ steps.container-artifacts.outputs.directory }}/neteco-trivy.json
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - run: docker save "$IMAGE_TAG" --output "$ARTIFACT_DIR/neteco-image.tar"
        env:
          IMAGE_TAG: neteco:${{ github.sha }}
          ARTIFACT_DIR: ${{ steps.container-artifacts.outputs.directory }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.container-artifacts.outcome == 'success'
        with:
          name: container-image
          path: ${{ steps.container-artifacts.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 3
      - name: Remove only this job's private artifact directory
        id: cleanup-container-artifacts
        if: always() && steps.container-artifacts.outcome == 'success'
        shell: bash
        env:
          ARTIFACT_DIR: ${{ steps.container-artifacts.outputs.directory }}
        run: |
          set -euo pipefail
          [[ -n "$ARTIFACT_DIR" && -d "$ARTIFACT_DIR" && ! -L "$ARTIFACT_DIR" ]]
          artifact_dir="$(realpath -e -- "$ARTIFACT_DIR")"
          temporary_root="$(realpath -e -- "$RUNNER_TEMP")"
          [[ "$artifact_dir" == "$ARTIFACT_DIR" && "$(dirname -- "$artifact_dir")" == "$temporary_root" ]]
          [[ "$(basename -- "$artifact_dir")" =~ ^neteco-container\.[a-zA-Z0-9]{8}$ ]]
          rm -rf -- "$artifact_dir"

  mutation:
    if: github.ref == 'refs/heads/main'
    runs-on:
      [
        self-hosted,
        Linux,
        ARM64,
        "${{ vars.NETECO_ORACLE_RUNNER_LABEL || 'neteco-oracle-unverified-do-not-register' }}"
      ]
    timeout-minutes: 25
    steps:
      - name: Verify approved Neteco repository
        shell: bash
        run: |
          test -n "$NETECO_GITHUB_REPOSITORY"
          test "$GITHUB_REPOSITORY" = "$NETECO_GITHUB_REPOSITORY"
          test "${GITHUB_REPOSITORY,,}" != 'publicher0/neteco-shop'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/storage-preflight.ts
      - run: npm ci
      - run: npm run test:mutation
      - run: npm run ci:artifacts -- --publish
        if: always()
        id: secure-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.secure-artifacts.outcome == 'success'
        with:
          name: mutation-evidence
          path: reports/mutation/
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    if: github.ref == 'refs/heads/main'
    runs-on:
      [
        self-hosted,
        Linux,
        ARM64,
        "${{ vars.NETECO_ORACLE_RUNNER_LABEL || 'neteco-oracle-unverified-do-not-register' }}"
      ]
    steps:
      - name: Verify approved Neteco repository
        shell: bash
        run: |
          test -n "$NETECO_GITHUB_REPOSITORY"
          test "$GITHUB_REPOSITORY" = "$NETECO_GITHUB_REPOSITORY"
          test "${GITHUB_REPOSITORY,,}" != 'publicher0/neteco-shop'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: node scripts/storage-preflight.ts
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITLEAKS_VERSION: '8.24.3'
      - name: Verify real Gitleaks policy behavior
        run: node scripts/lib/gitleaks-policy-probe.mjs --go "$GITHUB_WORKSPACE/.gitleaks.toml" "$RUNNER_TEMP"

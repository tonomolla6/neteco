name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NETECO_GITHUB_REPOSITORY: ${{ vars.NETECO_GITHUB_REPOSITORY }}

jobs:
  test-observations:
    if: github.ref == 'refs/heads/main'
    runs-on:
      [
        self-hosted,
        Linux,
        ARM64,
        "${{ vars.NETECO_ORACLE_RUNNER_LABEL || 'neteco-oracle-unverified-do-not-register' }}"
      ]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        observation: [1, 2]
    env:
      NETECO_FLAKE_OBSERVATION: ${{ matrix.observation }}
      NETECO_UI_STATE_CAPTURE_DIR: ${{ matrix.observation == 1 && 'test-results/ui013-components' || '' }}
      APP_ENV: test
      APP_BASE_URL: http://127.0.0.1:3100
      NUXT_PUBLIC_BASE_URL: http://127.0.0.1:3100
      NUXT_SESSION_PASSWORD: test-only-session-password-32-characters
      PAYMENT_PROVIDER: mock
      INVOICE_PROVIDER: mock
      CARRIER_PROVIDER: mock
      EMAIL_PROVIDER: log
    steps:
      - name: Verify approved Neteco repository
        shell: bash
        run: |
          test -n "$NETECO_GITHUB_REPOSITORY"
          test "$GITHUB_REPOSITORY" = "$NETECO_GITHUB_REPOSITORY"
          test "${GITHUB_REPOSITORY,,}" != 'publicher0/neteco-shop'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/storage-preflight.ts
      - name: Allocate isolated service identifiers
        id: service-identifiers
        shell: bash
        run: |
          set -euo pipefail
          id="$(node -p "require('node:crypto').randomUUID()")"
          printf 'id=%s\n' "$id" >> "$GITHUB_OUTPUT"
      - name: Start isolated PostgreSQL and Redis
        shell: bash
        env:
          SERVICE_ID: ${{ steps.service-identifiers.outputs.id }}
        run: |
          set -euo pipefail
          [[ "$SERVICE_ID" =~ ^[a-f0-9-]{36}$ ]]
          node /usr/local/libexec/neteco-ci/build-storage.mjs --estimated-output-gib 2
          /usr/local/libexec/neteco-ci/bin/docker create --pull=never --name "neteco-ci-$SERVICE_ID-postgres" \
            --label "neteco.ci.service=$SERVICE_ID" --cpus 0.5 --memory 256m --memory-swap 384m --pids-limit 128 \
            --publish 127.0.0.1::5432 --env POSTGRES_USER=neteco --env POSTGRES_PASSWORD=neteco-test \
            --env POSTGRES_DB=neteco_test postgres:17.6-alpine3.22 >/dev/null
          /usr/local/libexec/neteco-ci/bin/docker create --pull=never --name "neteco-ci-$SERVICE_ID-redis" \
            --label "neteco.ci.service=$SERVICE_ID" --cpus 0.5 --memory 256m --memory-swap 384m --pids-limit 128 \
            --publish 127.0.0.1::6379 redis:8.2.1-alpine3.22 >/dev/null
          /usr/local/libexec/neteco-ci/bin/docker start "neteco-ci-$SERVICE_ID-postgres" "neteco-ci-$SERVICE_ID-redis" >/dev/null
          for service in postgres redis; do
            ready=0
            for attempt in {1..30}; do
              if [[ "$service" == postgres ]]; then
                if [[ "$(/usr/local/libexec/neteco-ci/bin/docker exec -e PGPASSWORD=neteco-test "neteco-ci-$SERVICE_ID-postgres" psql -h 127.0.0.1 -U neteco -d neteco_test -At -c 'SELECT 1' 2>/dev/null)" == 1 ]]; then ready=1; break; fi
              else
                if [[ "$(/usr/local/libexec/neteco-ci/bin/docker exec "neteco-ci-$SERVICE_ID-redis" redis-cli ping 2>/dev/null)" == PONG ]]; then ready=1; break; fi
              fi
              sleep 1
            done
            [[ "$ready" == 1 ]]
          done
          pg_address="$(/usr/local/libexec/neteco-ci/bin/docker port "neteco-ci-$SERVICE_ID-postgres" 5432/tcp)"
          redis_address="$(/usr/local/libexec/neteco-ci/bin/docker port "neteco-ci-$SERVICE_ID-redis" 6379/tcp)"
          [[ "$pg_address" =~ ^127\.0\.0\.1:([0-9]+)$ ]]
          printf 'DATABASE_URL=postgres://neteco:neteco-test@127.0.0.1:%s/neteco_test\n' "${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          [[ "$redis_address" =~ ^127\.0\.0\.1:([0-9]+)$ ]]
          printf 'REDIS_URL=redis://127.0.0.1:%s/0\n' "${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - name: Compile current Cloudflare CSS for component evidence
        if: matrix.observation == 1
        shell: bash
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--max-old-space-size=4096 --require=$GITHUB_WORKSPACE/scripts/limit-build-workers.cjs"
          node scripts/ci-build-memory-preflight.mjs
          npm run build:cloudflare-ui
      - run: npm run test:flake-monitor
      - run: npm run ci:artifacts -- --publish
        if: always()
        id: observation-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.observation-artifacts.outcome == 'success'
        with:
          name: flake-observation-${{ matrix.observation }}-${{ github.run_attempt }}
          path: test-results/flake-observation-${{ matrix.observation }}/
          if-no-files-found: error
          retention-days: 14
      - name: Remove isolated PostgreSQL and Redis
        if: always() && steps.service-identifiers.outcome == 'success'
        shell: bash
        env:
          SERVICE_ID: ${{ steps.service-identifiers.outputs.id }}
        run: |
          set -euo pipefail
          [[ "$SERVICE_ID" =~ ^[a-f0-9-]{36}$ ]]
          /usr/local/libexec/neteco-ci/bin/docker info --format '{{.ServerVersion}}' >/dev/null
          for service in postgres redis; do
            name="neteco-ci-$SERVICE_ID-$service"
            if /usr/local/libexec/neteco-ci/bin/docker container inspect "$name" >/dev/null 2>&1; then
              [[ "$(/usr/local/libexec/neteco-ci/bin/docker inspect --format '{{ index .Config.Labels "neteco.ci.service" }}' "$name")" == "$SERVICE_ID" ]]
              /usr/local/libexec/neteco-ci/bin/docker rm --force --volumes "$name" >/dev/null
            fi
          done

  quality:
    needs: [test-observations]
    if: github.ref == 'refs/heads/main'
    runs-on:
      [
        self-hosted,
        Linux,
        ARM64,
        "${{ vars.NETECO_ORACLE_RUNNER_LABEL || 'neteco-oracle-unverified-do-not-register' }}"
      ]
    timeout-minutes: 90
    env:
      APP_ENV: test
      APP_BASE_URL: http://127.0.0.1:3100
      NUXT_PUBLIC_BASE_URL: http://127.0.0.1:3100
      NUXT_SESSION_PASSWORD: test-only-session-password-32-characters
      PAYMENT_PROVIDER: mock
      INVOICE_PROVIDER: mock
      CARRIER_PROVIDER: mock
      EMAIL_PROVIDER: log
    steps:
      - name: Verify approved Neteco repository
        shell: bash
        run: |
          test -n "$NETECO_GITHUB_REPOSITORY"
          test "$GITHUB_REPOSITORY" = "$NETECO_GITHUB_REPOSITORY"
          test "${GITHUB_REPOSITORY,,}" != 'publicher0/neteco-shop'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/storage-preflight.ts
      - name: Allocate isolated service identifiers
        id: service-identifiers
        shell: bash
        run: |
          set -euo pipefail
          id="$(node -p "require('node:crypto').randomUUID()")"
          printf 'id=%s\n' "$id" >> "$GITHUB_OUTPUT"
      - name: Start isolated PostgreSQL and Redis
        shell: bash
        env:
          SERVICE_ID: ${{ steps.service-identifiers.outputs.id }}
        run: |
          set -euo pipefail
          [[ "$SERVICE_ID" =~ ^[a-f0-9-]{36}$ ]]
          node /usr/local/libexec/neteco-ci/build-storage.mjs --estimated-output-gib 2
          /usr/local/libexec/neteco-ci/bin/docker create --pull=never --name "neteco-ci-$SERVICE_ID-postgres" \
            --label "neteco.ci.service=$SERVICE_ID" --cpus 0.5 --memory 256m --memory-swap 384m --pids-limit 128 \
            --publish 127.0.0.1::5432 --env POSTGRES_USER=neteco --env POSTGRES_PASSWORD=neteco-test \
            --env POSTGRES_DB=neteco_test postgres:17.6-alpine3.22 >/dev/null
          /usr/local/libexec/neteco-ci/bin/docker create --pull=never --name "neteco-ci-$SERVICE_ID-redis" \
            --label "neteco.ci.service=$SERVICE_ID" --cpus 0.5 --memory 256m --memory-swap 384m --pids-limit 128 \
            --publish 127.0.0.1::6379 redis:8.2.1-alpine3.22 >/dev/null
          /usr/local/libexec/neteco-ci/bin/docker start "neteco-ci-$SERVICE_ID-postgres" "neteco-ci-$SERVICE_ID-redis" >/dev/null
          for service in postgres redis; do
            ready=0
            for attempt in {1..30}; do
              if [[ "$service" == postgres ]]; then
                if [[ "$(/usr/local/libexec/neteco-ci/bin/docker exec -e PGPASSWORD=neteco-test "neteco-ci-$SERVICE_ID-postgres" psql -h 127.0.0.1 -U neteco -d neteco_test -At -c 'SELECT 1' 2>/dev/null)" == 1 ]]; then ready=1; break; fi
              else
                if [[ "$(/usr/local/libexec/neteco-ci/bin/docker exec "neteco-ci-$SERVICE_ID-redis" redis-cli ping 2>/dev/null)" == PONG ]]; then ready=1; break; fi
              fi
              sleep 1
            done
            [[ "$ready" == 1 ]]
          done
          pg_address="$(/usr/local/libexec/neteco-ci/bin/docker port "neteco-ci-$SERVICE_ID-postgres" 5432/tcp)"
          redis_address="$(/usr/local/libexec/neteco-ci/bin/docker port "neteco-ci-$SERVICE_ID-redis" 6379/tcp)"
          [[ "$pg_address" =~ ^127\.0\.0\.1:([0-9]+)$ ]]
          printf 'DATABASE_URL=postgres://neteco:neteco-test@127.0.0.1:%s/neteco_test\n' "${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          [[ "$redis_address" =~ ^127\.0\.0\.1:([0-9]+)$ ]]
          printf 'REDIS_URL=redis://127.0.0.1:%s/0\n' "${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
        env:
          # nuxt typecheck (vue-tsc) exceeds the default V8 heap on this codebase.
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run requirements:audit
      - run: npm run test:determinism
      - run: npm run test:flaky-policy
      - run: npm run ci:artifacts
      - run: npm run db:migrate
      - run: npm run db:seed
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: flake-observation-1-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flake-observations/flake-observation-1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: flake-observation-2-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flake-observations/flake-observation-2
      - run: npm run test:flake-monitor
        env:
          NETECO_FLAKE_ARTIFACTS: ${{ runner.temp }}/flake-observations
      - run: npm run audit:exploratory
      - run: npm run audit:uat:policy
      - run: npm run build
      - run: npm run test:performance
        shell: /usr/local/libexec/neteco-ci/remote-browser-shell {0}
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:8997/neteco-ci-browser
          PW_TEST_CONNECT_EXPOSE_NETWORK: <loopback>
      - run: npx tsx scripts/performance-gate.ts --report test-results/performance.json --diff-out test-results/performance-diff.md
      - run: npm run test:e2e -- --project=chromium --grep-invert accessibility
        shell: /usr/local/libexec/neteco-ci/remote-browser-shell {0}
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:8997/neteco-ci-browser
          PW_TEST_CONNECT_EXPOSE_NETWORK: <loopback>
      - run: npm run test:a11y
        shell: /usr/local/libexec/neteco-ci/remote-browser-shell {0}
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:8997/neteco-ci-browser
          PW_TEST_CONNECT_EXPOSE_NETWORK: <loopback>
      - run: npm run test:browser-matrix
        shell: /usr/local/libexec/neteco-ci/remote-browser-shell {0}
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:8997/neteco-ci-browser
          PW_TEST_CONNECT_EXPOSE_NETWORK: <loopback>
      - run: npm run test:flake-browser
        shell: /usr/local/libexec/neteco-ci/remote-browser-shell {0}
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:8997/neteco-ci-browser
          PW_TEST_CONNECT_EXPOSE_NETWORK: <loopback>
      - run: npm run test:visual
        shell: /usr/local/libexec/neteco-ci/remote-browser-shell {0}
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:8997/neteco-ci-browser
          PW_TEST_CONNECT_EXPOSE_NETWORK: <loopback>
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .output
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - run: npm run ci:artifacts -- --publish --require-complete
        id: complete-artifacts
      - run: npm run ci:artifacts -- --publish
        if: failure()
        id: partial-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && (steps.complete-artifacts.outcome == 'success' || steps.partial-artifacts.outcome == 'success')
        with:
          name: quality-evidence
          path: |
            coverage/
            test-results/
            playwright-report/
            playwright-a11y-report/
            playwright-matrix-report/
            playwright-visual-report/
            sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove isolated PostgreSQL and Redis
        if: always() && steps.service-identifiers.outcome == 'success'
        shell: bash
        env:
          SERVICE_ID: ${{ steps.service-identifiers.outputs.id }}
        run: |
          set -euo pipefail
          [[ "$SERVICE_ID" =~ ^[a-f0-9-]{36}$ ]]
          /usr/local/libexec/neteco-ci/bin/docker info --format '{{.ServerVersion}}' >/dev/null
          for service in postgres redis; do
            name="neteco-ci-$SERVICE_ID-$service"
            if /usr/local/libexec/neteco-ci/bin/docker container inspect "$name" >/dev/null 2>&1; then
              [[ "$(/usr/local/libexec/neteco-ci/bin/docker inspect --format '{{ index .Config.Labels "neteco.ci.service" }}' "$name")" == "$SERVICE_ID" ]]
              /usr/local/libexec/neteco-ci/bin/docker rm --force --volumes "$name" >/dev/null
            fi
          done

  container:
    if: github.ref == 'refs/heads/main'
    runs-on:
      [
        self-hosted,
        Linux,
        ARM64,
        "${{ vars.NETECO_ORACLE_RUNNER_LABEL || 'neteco-oracle-unverified-do-not-register' }}"
      ]
    timeout-minutes: 45
    steps:
      - name: Verify approved Neteco repository
        shell: bash
        run: |
          test -n "$NETECO_GITHUB_REPOSITORY"
          test "$GITHUB_REPOSITORY" = "$NETECO_GITHUB_REPOSITORY"
          test "${GITHUB_REPOSITORY,,}" != 'publicher0/neteco-shop'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/storage-preflight.ts
      - run: node /usr/local/libexec/neteco-ci/build-storage.mjs --estimated-output-gib 3
      - run: node scripts/ci-build-memory-preflight.mjs
      - run: npm ci
      - name: Compile runtime on the admitted Oracle runner
        shell: bash
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--max-old-space-size=4096 --require=$GITHUB_WORKSPACE/scripts/limit-build-workers.cjs"
          node scripts/ci-build-memory-preflight.mjs
          npm run build
      - name: Allocate private container artifact directory
        id: container-artifacts
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RUNNER_TEMP:-}" && "$RUNNER_TEMP" = /* && -d "$RUNNER_TEMP" ]]
          [[ "$(realpath -e -- "$RUNNER_TEMP")" == "$RUNNER_TEMP" ]]
          [[ "${GITHUB_RUN_ID:-}" =~ ^[0-9]{1,20}$ && "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]{1,10}$ ]]
          umask 077
          artifact_dir="$(mktemp -d "$RUNNER_TEMP/neteco-container.XXXXXXXX")"
          [[ "$(basename -- "$artifact_dir")" =~ ^neteco-container\.([A-Za-z0-9]{8})$ ]]
          builder_name="neteco-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${BASH_REMATCH[1]}"
          printf 'directory=%s\n' "$artifact_dir" >> "$GITHUB_OUTPUT"
          printf 'builder=%s\n' "$builder_name" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        id: buildx
        with:
          name: ${{ steps.container-artifacts.outputs.builder }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.ci
          build-contexts: neteco-output=.output
          build-args: APP_VERSION=${{ github.sha }}
          push: false
          tags: neteco:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=neteco-linux-arm64
          cache-to: type=gha,scope=neteco-linux-arm64,mode=max
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: neteco:${{ github.sha }}
          format: spdx-json
          output-file: ${{ steps.container-artifacts.outputs.directory }}/neteco-container-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: neteco:${{ github.sha }}
          format: json
          output: ${{ steps.container-artifacts.outputs.directory }}/neteco-trivy.json
          cache-dir: ${{ steps.container-artifacts.outputs.directory }}/.trivy-cache
          cache: 'false'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - run: /usr/local/libexec/neteco-ci/bin/docker save "$IMAGE_TAG" --output "$ARTIFACT_DIR/neteco-image.tar"
        env:
          IMAGE_TAG: neteco:${{ github.sha }}
          ARTIFACT_DIR: ${{ steps.container-artifacts.outputs.directory }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.container-artifacts.outcome == 'success'
        with:
          name: container-image
          path: ${{ steps.container-artifacts.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 3
      - name: Remove only this job's buildx builder
        id: cleanup-buildx
        if: always() && steps.container-artifacts.outcome == 'success' && steps.buildx.outcome != 'skipped'
        shell: bash
        env:
          BUILDER_NAME: ${{ steps.container-artifacts.outputs.builder }}
          ARTIFACT_DIR: ${{ steps.container-artifacts.outputs.directory }}
        run: bash scripts/cleanup-ci-builder.sh
      - name: Remove only this job's private artifact directory
        id: cleanup-container-artifacts
        if: always() && steps.container-artifacts.outcome == 'success'
        shell: bash
        env:
          ARTIFACT_DIR: ${{ steps.container-artifacts.outputs.directory }}
        run: |
          set -euo pipefail
          [[ -n "$ARTIFACT_DIR" && -d "$ARTIFACT_DIR" && ! -L "$ARTIFACT_DIR" ]]
          artifact_dir="$(realpath -e -- "$ARTIFACT_DIR")"
          temporary_root="$(realpath -e -- "$RUNNER_TEMP")"
          [[ "$artifact_dir" == "$ARTIFACT_DIR" && "$(dirname -- "$artifact_dir")" == "$temporary_root" ]]
          [[ "$(basename -- "$artifact_dir")" =~ ^neteco-container\.[a-zA-Z0-9]{8}$ ]]
          rm -rf -- "$artifact_dir"

  mutation:
    if: github.ref == 'refs/heads/main'
    runs-on:
      [
        self-hosted,
        Linux,
        ARM64,
        "${{ vars.NETECO_ORACLE_RUNNER_LABEL || 'neteco-oracle-unverified-do-not-register' }}"
      ]
    timeout-minutes: 120
    steps:
      - name: Verify approved Neteco repository
        shell: bash
        run: |
          test -n "$NETECO_GITHUB_REPOSITORY"
          test "$GITHUB_REPOSITORY" = "$NETECO_GITHUB_REPOSITORY"
          test "${GITHUB_REPOSITORY,,}" != 'publicher0/neteco-shop'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/storage-preflight.ts
      - name: Allocate isolated mutation service identifiers
        id: mutation-service-identifiers
        shell: bash
        run: |
          set -euo pipefail
          id="$(node -p "require('node:crypto').randomUUID()")"
          printf 'id=%s\n' "$id" >> "$GITHUB_OUTPUT"
      - name: Start isolated mutation PostgreSQL and Redis
        shell: bash
        env:
          SERVICE_ID: ${{ steps.mutation-service-identifiers.outputs.id }}
        run: |
          set -euo pipefail
          [[ "$SERVICE_ID" =~ ^[a-f0-9-]{36}$ ]]
          node /usr/local/libexec/neteco-ci/build-storage.mjs --estimated-output-gib 2
          /usr/local/libexec/neteco-ci/bin/docker create --pull=never --name "neteco-ci-$SERVICE_ID-postgres" \
            --label "neteco.ci.service=$SERVICE_ID" --cpus 0.5 --memory 256m --memory-swap 384m --pids-limit 128 \
            --publish 127.0.0.1::5432 --env POSTGRES_USER=neteco --env POSTGRES_PASSWORD=neteco-test \
            --env POSTGRES_DB=neteco_test postgres:17.6-alpine3.22 >/dev/null
          /usr/local/libexec/neteco-ci/bin/docker create --pull=never --name "neteco-ci-$SERVICE_ID-redis" \
            --label "neteco.ci.service=$SERVICE_ID" --cpus 0.5 --memory 256m --memory-swap 384m --pids-limit 128 \
            --publish 127.0.0.1::6379 redis:8.2.1-alpine3.22 >/dev/null
          /usr/local/libexec/neteco-ci/bin/docker start "neteco-ci-$SERVICE_ID-postgres" "neteco-ci-$SERVICE_ID-redis" >/dev/null
          for service in postgres redis; do
            ready=0
            for attempt in {1..30}; do
              if [[ "$service" == postgres ]]; then
                if [[ "$(/usr/local/libexec/neteco-ci/bin/docker exec -e PGPASSWORD=neteco-test "neteco-ci-$SERVICE_ID-postgres" psql -h 127.0.0.1 -U neteco -d neteco_test -At -c 'SELECT 1' 2>/dev/null)" == 1 ]]; then ready=1; break; fi
              else
                if [[ "$(/usr/local/libexec/neteco-ci/bin/docker exec "neteco-ci-$SERVICE_ID-redis" redis-cli ping 2>/dev/null)" == PONG ]]; then ready=1; break; fi
              fi
              sleep 1
            done
            [[ "$ready" == 1 ]]
          done
          pg_address="$(/usr/local/libexec/neteco-ci/bin/docker port "neteco-ci-$SERVICE_ID-postgres" 5432/tcp)"
          redis_address="$(/usr/local/libexec/neteco-ci/bin/docker port "neteco-ci-$SERVICE_ID-redis" 6379/tcp)"
          [[ "$pg_address" =~ ^127\.0\.0\.1:([0-9]+)$ ]]
          printf 'DATABASE_URL=postgres://neteco:neteco-test@127.0.0.1:%s/neteco_test\n' "${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          [[ "$redis_address" =~ ^127\.0\.0\.1:([0-9]+)$ ]]
          printf 'REDIS_URL=redis://127.0.0.1:%s/0\n' "${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run test:mutation
      - run: npm run ci:artifacts -- --publish
        if: always()
        id: secure-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.secure-artifacts.outcome == 'success'
        with:
          name: mutation-evidence
          path: reports/mutation/
          if-no-files-found: error
          retention-days: 14
      - name: Remove isolated mutation PostgreSQL and Redis
        if: always() && steps.mutation-service-identifiers.outcome == 'success'
        shell: bash
        env:
          SERVICE_ID: ${{ steps.mutation-service-identifiers.outputs.id }}
        run: |
          set -euo pipefail
          [[ "$SERVICE_ID" =~ ^[a-f0-9-]{36}$ ]]
          /usr/local/libexec/neteco-ci/bin/docker info --format '{{.ServerVersion}}' >/dev/null
          for service in postgres redis; do
            name="neteco-ci-$SERVICE_ID-$service"
            if /usr/local/libexec/neteco-ci/bin/docker container inspect "$name" >/dev/null 2>&1; then
              [[ "$(/usr/local/libexec/neteco-ci/bin/docker inspect --format '{{ index .Config.Labels "neteco.ci.service" }}' "$name")" == "$SERVICE_ID" ]]
              /usr/local/libexec/neteco-ci/bin/docker rm --force --volumes "$name" >/dev/null
            fi
          done

  secret-scan:
    if: github.ref == 'refs/heads/main'
    runs-on:
      [
        self-hosted,
        Linux,
        ARM64,
        "${{ vars.NETECO_ORACLE_RUNNER_LABEL || 'neteco-oracle-unverified-do-not-register' }}"
      ]
    steps:
      - name: Verify approved Neteco repository
        shell: bash
        run: |
          test -n "$NETECO_GITHUB_REPOSITORY"
          test "$GITHUB_REPOSITORY" = "$NETECO_GITHUB_REPOSITORY"
          test "${GITHUB_REPOSITORY,,}" != 'publicher0/neteco-shop'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: node scripts/storage-preflight.ts
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITLEAKS_VERSION: '8.24.3'
          # The isolated runner's HOME is outside the workspace, which breaks the action's
          # SARIF artifact upload; the scan itself still runs and fails the job on findings.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - name: Verify real Gitleaks policy behavior
        run: node scripts/lib/gitleaks-policy-probe.mjs --go "$GITHUB_WORKSPACE/.gitleaks.toml" "$RUNNER_TEMP"

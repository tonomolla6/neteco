name: Staging operational UAT evidence check

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 40-character SHA deployed in staging and covered by the UAT
        required: true
        type: string
      evidence_path:
        description: Repository-relative path to the sanitized final UAT manifest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-uat-${{ inputs.expected_commit }}
  cancel-in-progress: false

env:
  NETECO_GITHUB_REPOSITORY: ${{ vars.NETECO_GITHUB_REPOSITORY }}

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on:
      [
        self-hosted,
        Linux,
        ARM64,
        "${{ vars.NETECO_ORACLE_RUNNER_LABEL || 'neteco-oracle-unverified-do-not-register' }}"
      ]
    timeout-minutes: 10
    environment: staging
    env:
      UAT_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      UAT_STAGING_URL: ${{ vars.UAT_STAGING_URL }}
      UAT_PRODUCTION_URL: ${{ vars.UAT_PRODUCTION_URL }}
      UAT_EVIDENCE_PATH: uat-evidence-source/${{ inputs.evidence_path }}
      UAT_EVIDENCE_REPOSITORY_ROOT: uat-evidence-source
    steps:
      - name: Verify approved Neteco repository
        shell: bash
        run: |
          test -n "$NETECO_GITHUB_REPOSITORY"
          test "$GITHUB_REPOSITORY" = "$NETECO_GITHUB_REPOSITORY"
          test "${GITHUB_REPOSITORY,,}" != 'publicher0/neteco-shop'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Admit only an existing commit in trusted main history
        id: validate-commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UAT_EXPECTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]
          git cat-file -e "$UAT_EXPECTED_COMMIT^{commit}"
          git merge-base --is-ancestor "$UAT_EXPECTED_COMMIT" "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_commit }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          path: uat-evidence-source
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/storage-preflight.ts
      - run: npm ci
      - run: npm run audit:uat:policy
      - run: npm run uat:preflight
      - run: npm run audit:uat -- "$UAT_EVIDENCE_PATH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: operational-uat-evidence-${{ inputs.expected_commit }}
          path: |
            test-results/operational-uat-preflight.json
            test-results/operational-uat-manifest.json
            test-results/operational-uat-evidence.json
          if-no-files-found: warn
          retention-days: 30
